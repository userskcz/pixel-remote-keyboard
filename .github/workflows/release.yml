name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag matching version.properties
        required: true
        default: v0.3.0-beta.2
permissions:
  contents: write
jobs:
  signed-apks:
    runs-on: ubuntu-latest
    environment: release
    env:
      PRK_TAG: ${{ inputs.tag }}
      PRK_KEYSTORE_BASE64: ${{ secrets.PRK_KEYSTORE_BASE64 }}
      PRK_KEYSTORE_PASSWORD: ${{ secrets.PRK_KEYSTORE_PASSWORD }}
      PRK_KEY_ALIAS: ${{ secrets.PRK_KEY_ALIAS }}
      PRK_KEY_PASSWORD: ${{ secrets.PRK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate version and required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          test "$PRK_TAG" = "v$VERSION"
          test -n "$PRK_KEYSTORE_BASE64"
          test -n "$PRK_KEYSTORE_PASSWORD"
          test -n "$PRK_KEY_ALIAS"
          test -n "$PRK_KEY_PASSWORD"
          if git rev-parse --verify "refs/tags/$PRK_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$PRK_TAG")" = "$GITHUB_SHA"
          fi
          printf '%s' "$PRK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "PRK_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed release APKs
        run: ./gradlew :protocol:test :phone:lintRelease :watch:lintRelease :phone:assembleRelease :watch:assembleRelease --console=plain
      - name: Verify matching signatures and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp phone/build/outputs/apk/release/phone-release.apk release-assets/pixel-keyboard-phone.apk
          cp watch/build/outputs/apk/release/watch-release.apk release-assets/pixel-keyboard-watch.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs release-assets/pixel-keyboard-phone.apk > "$RUNNER_TEMP/phone-cert.txt"
          "$SIGNER" verify --print-certs release-assets/pixel-keyboard-watch.apk > "$RUNNER_TEMP/watch-cert.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/phone-cert.txt" > "$RUNNER_TEMP/phone-sha.txt"
          grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/watch-cert.txt" > "$RUNNER_TEMP/watch-sha.txt"
          test -s "$RUNNER_TEMP/phone-sha.txt"
          cmp "$RUNNER_TEMP/phone-sha.txt" "$RUNNER_TEMP/watch-sha.txt"
          cd release-assets
          sha256sum pixel-keyboard-phone.apk pixel-keyboard-watch.apk > SHA256SUMS.txt
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$PRK_TAG" --target "$GITHUB_SHA" --draft --prerelease --title "Pixel Remote Keyboard $PRK_TAG" --notes-file docs/RELEASE_NOTES.md release-assets/pixel-keyboard-phone.apk release-assets/pixel-keyboard-watch.apk release-assets/SHA256SUMS.txt
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
